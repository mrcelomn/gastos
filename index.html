<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gastos</title>
<meta name="theme-color" content="#b5215e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --text: #1c1f2b;
    --muted: #6b7082;
    --line: #e6e8ef;
    --accent: #b5215e;
    --accent-strong: #8e1747;
    --accent-soft: #fbe8f0;
    --warn: #9a6200;
    --warn-soft: #fdf2d9;
    --danger: #c0392b;
    --debito: #4a5a8d;
    --debito-soft: #e8ecf6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1016;
      --card: #1a1c25;
      --text: #eceef5;
      --muted: #9a9fb2;
      --line: #2a2d3a;
      --accent: #ef5f95;
      --accent-strong: #b5215e;
      --accent-soft: #3b1a28;
      --warn: #f2c05c;
      --warn-soft: #3a2e14;
      --danger: #ff7b6b;
      --debito: #9fb0e6;
      --debito-soft: #232a40;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  button, input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; }
  header .marca { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  header .marca svg { width: 32px; height: 32px; flex: none; border-radius: 9px; }
  header .marca div { min-width: 0; }
  header .marca b { display: block; font-size: 17px; letter-spacing: -.01em; }
  header h1 { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .05em; margin: 1px 0 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { border: 0; background: var(--card); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }

  main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  .hero { margin: 4px 0 6px; padding: 18px 18px 16px; border-radius: 20px; color: #fff;
    background: linear-gradient(135deg, #c92a69 0%, #8e1747 100%);
    box-shadow: 0 10px 24px -12px rgba(142, 23, 71, .55); position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px;
    border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .label { font-size: 14px; opacity: .85; }
  .hero .total { font-size: 36px; font-weight: 750; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hero .split { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
  .hero .chip { background: rgba(255,255,255,.16); color: #fff; }
  .hero .chip.warn { background: #fff; color: var(--accent-strong); }
  .hero .chip.warn.on { background: #ffd966; color: #4a3500; }
  .chip { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600;
    background: var(--card); color: var(--muted); cursor: pointer; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.on { background: var(--accent); color: #fff; }

  .day { margin-top: 14px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
    padding: 0 4px 6px; }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line);
    cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .list .item:first-child { border-top: 0; }
  .item .dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-size: 14px; font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
  .item.pend .dot { background: var(--warn-soft); color: var(--warn); }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item.pend .sub { color: var(--warn); font-weight: 600; }
  .item .val { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: var(--debito-soft); color: var(--debito); margin-top: 3px; }

  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .03em; text-transform: uppercase; }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .kv:first-of-type { border-top: 0; }
  .kv b { font-variant-numeric: tabular-nums; }
  .bar-row { padding: 8px 0; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 15px; }
  .bar-row .top b { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent-soft); margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar-row .pct { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .hint { font-size: 13px; color: var(--muted); margin: 8px 4px 0; line-height: 1.4; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: none; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--accent); }

  .fab { position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 7;
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
    box-shadow: 0 8px 20px -6px rgba(142, 23, 71, .6); display: grid; place-items: center; cursor: pointer; }
  .fab svg { width: 26px; height: 26px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); font-size: 16px; appearance: none; -webkit-appearance: none; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
  .seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 10px 12px; border-radius: 10px;
    background: var(--accent-soft); margin-bottom: 12px; line-height: 1.35; }
  .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }
  .row-btns { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; border: 0; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
  .btn.sec { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: none; color: var(--danger); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }

  .lock { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; max-width: 380px; margin: 0 auto; text-align: center; }
  .lock svg { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 12px 28px -10px rgba(142, 23, 71, .6); margin-bottom: 18px; }
  .lock h2 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
  .lock p { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  .lock .field { width: 100%; text-align: left; }
  .lock .btn { flex: none; width: 100%; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30;
    max-width: calc(100% - 32px); text-align: center; }
  .loading { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .menu { position: fixed; top: calc(56px + env(safe-area-inset-top)); right: 16px; z-index: 15; background: var(--card);
    border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); overflow: hidden; min-width: 220px; }
  .menu button, .menu a { display: block; width: 100%; padding: 14px 16px; border: 0; background: none; text-align: left;
    border-top: 1px solid var(--line); cursor: pointer; text-decoration: none; color: var(--text); font-size: 15px; }
  .menu > :first-child { border-top: 0; }
  .menu .danger { color: var(--danger); }

  .periodo { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
  .periodo button { border: 0; background: var(--card); width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; color: var(--text); }
  .periodo button:disabled { opacity: .3; }
  .periodo button svg { width: 16px; height: 16px; }
  .periodo .nome { font-weight: 700; font-size: 15px; text-align: center; }
  .periodo .datas { font-size: 12px; color: var(--muted); text-align: center; margin-top: 1px; }
  .lock form { width: 100%; }
  .lock .field input { text-align: left; }
  .lock .erro { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 8px; }
</style>
</head>
<body>

<!-- Entrar -->
<section id="lock" class="lock hidden">
  <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d1336f"/><stop offset="1" stop-color="#8e1747"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lga)"/><rect x="15" y="34" width="8" height="15" rx="4" fill="#fff" opacity=".55"/><rect x="28" y="25" width="8" height="24" rx="4" fill="#fff" opacity=".8"/><rect x="41" y="15" width="8" height="34" rx="4" fill="#fff"/></svg>
  <h2>Gastos</h2>
  <p>Entre com seu e-mail e senha.</p>
  <form id="form-login">
    <div class="field"><input id="email" type="email" placeholder="E-mail" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required></div>
    <div class="erro" id="login-erro"></div>
    <button class="btn" id="entrar" type="submit">Entrar</button>
  </form>
</section>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <div class="marca"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d1336f"/><stop offset="1" stop-color="#8e1747"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgb)"/><rect x="15" y="34" width="8" height="15" rx="4" fill="#fff" opacity=".55"/><rect x="28" y="25" width="8" height="24" rx="4" fill="#fff" opacity=".8"/><rect x="41" y="15" width="8" height="34" rx="4" fill="#fff"/></svg><div><b>Gastos</b><h1 id="titulo">&nbsp;</h1></div></div>
    <button class="icon-btn" id="btn-recarregar" aria-label="Atualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btn-menu" aria-label="Mais opções">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <main>
    <div class="periodo" id="periodo"></div>
    <section id="tela-gastos"></section>
    <section id="tela-resumo" class="hidden"></section>
    <section id="tela-fatura" class="hidden"></section>
    <section id="tela-regras" class="hidden"></section>
  </main>

  <button class="fab" id="fab" aria-label="Adicionar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav>
    <button data-tela="gastos" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      Gastos
    </button>
    <button data-tela="resumo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Resumo
    </button>
    <button data-tela="fatura">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      Fatura
    </button>
    <button data-tela="regras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      Regras
    </button>
  </nav>
</div>

<div id="menu" class="menu hidden">
  <button id="m-novo-periodo">Começar novo mês</button>
  <button id="m-planilha">Abrir planilha</button>
  <button id="m-sair" class="danger">Sair</button>
</div>

<div id="sheet-bg" class="sheet-bg hidden"><div class="sheet" id="sheet"></div></div>
<div id="loading" class="loading hidden">Carregando…</div>
<div id="toast" class="toast hidden"></div>

<script>
/* ---------- Configuração do Supabase (pública por natureza; os dados são protegidos pelo login) ---------- */
var SUPABASE_URL = 'https://nkcypuoosdsdbokokdhh.supabase.co';
var SUPABASE_ANON = 'sb_publishable_BYToIfOKNBVoNPaPVSgQJw_M1nw0fpZ';

(function () {
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
  var estado = { periodos: [], idx: 0, gastos: [], regras: [], tela: 'gastos', filtroPend: false };
  var brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var MESES = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hoje() {
    var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dataCurta(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function dataLonga(iso) {
    var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function diaAnterior(iso) {
    var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 3200);
  }
  function carregando(on) { $('loading').classList.toggle('hidden', !on); }
  function erroMsg(e) { return (e && e.message) ? e.message : String(e); }
  async function q(promessa) { // executa uma consulta e lança o erro, se houver
    var r = await promessa; if (r.error) throw r.error; return r.data;
  }
  // Gasto dividido: coluna 'Crédito' com parte em Débito (campo debito). valor é sempre o total.
  function partes(g) {
    if (g.coluna === 'Débito') return { cred: 0, deb: +g.valor };
    var d = +(g.debito || 0); return { cred: +g.valor - d, deb: d };
  }
  function dividido(g) { return g.coluna !== 'Débito' && +(g.debito || 0) > 0; }
  function pendente(g) { return !g.categoria || g.categoria === '?'; }
  function periodoAtual() { return estado.periodos[estado.idx]; }
  function fimDoPeriodo(i) { return estado.periodos[i + 1] ? estado.periodos[i + 1].inicio : null; } // exclusivo
  function categorias() {
    var s = {};
    estado.gastos.forEach(function (g) { if (!pendente(g)) s[g.categoria] = 1; });
    estado.regras.forEach(function (r) { s[r.categoria] = 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }
  function motivos() {
    var s = {};
    estado.gastos.forEach(function (g) { if (!pendente(g)) s[g.motivo] = 1; });
    estado.regras.forEach(function (r) { s[r.motivo] = 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }
  function datalist(id, itens) {
    return '<datalist id="' + id + '">' + itens.map(function (i) { return '<option value="' + esc(i) + '">'; }).join('') + '</datalist>';
  }

  /* ---------- dados ---------- */
  async function carregarTudo(manterPeriodo) {
    carregando(true);
    try {
      var periodos = await q(sb.from('periodos').select('*').order('inicio'));
      if (!periodos.length) periodos = [{ id: null, nome: 'GASTOS', inicio: '2000-01-01' }];
      var idAntes = manterPeriodo && periodoAtual() ? periodoAtual().id : null;
      estado.periodos = periodos;
      var i = idAntes == null ? -1 : periodos.findIndex(function (p) { return p.id === idAntes; });
      estado.idx = i >= 0 ? i : periodos.length - 1;
      estado.regras = await q(sb.from('regras').select('*').order('ordem').order('id'));
      await carregarGastos();
    } finally { carregando(false); }
  }
  async function carregarGastos() {
    var p = periodoAtual(), fim = fimDoPeriodo(estado.idx);
    var consulta = sb.from('gastos').select('*').gte('data', p.inicio);
    if (fim) consulta = consulta.lt('data', fim);
    estado.gastos = await q(consulta.order('data').order('id'));
    render();
  }
  async function atualizar(msg) {
    try { await carregarTudo(true); if (msg) toast(msg); } catch (e) { toast(erroMsg(e)); }
  }

  /* ---------- entrar / sair ---------- */
  function mostrarLock() { $('app').classList.add('hidden'); $('lock').classList.remove('hidden'); }
  function mostrarApp() { $('lock').classList.add('hidden'); $('app').classList.remove('hidden'); }
  $('form-login').onsubmit = async function (e) {
    e.preventDefault();
    $('login-erro').textContent = ''; $('entrar').disabled = true;
    var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
    $('entrar').disabled = false;
    if (r.error) { $('login-erro').textContent = 'E-mail ou senha incorretos.'; return; }

  };
  $('m-sair').onclick = async function () { fecharMenu(); await sb.auth.signOut(); mostrarLock(); };

  /* ---------- telas ---------- */
  function render() {
    var p = periodoAtual(), fim = fimDoPeriodo(estado.idx);
    $('titulo').textContent = p.nome;
    $('periodo').innerHTML =
      '<button id="p-ant" aria-label="Mês anterior"' + (estado.idx === 0 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
      '<div><div class="nome">' + esc(p.nome) + '</div><div class="datas">' +
      (p.id == null ? 'Todos os gastos' : 'De ' + dataCurta(p.inicio) + (fim ? ' a ' + dataCurta(diaAnterior(fim)) : ' até hoje')) + '</div></div>' +
      '<button id="p-prox" aria-label="Próximo mês"' + (estado.idx >= estado.periodos.length - 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>';
    $('p-ant').onclick = function () { mudarPeriodo(-1); };
    $('p-prox').onclick = function () { mudarPeriodo(1); };
    $('periodo').classList.toggle('hidden', estado.tela === 'regras');
    ['gastos', 'resumo', 'fatura', 'regras'].forEach(function (t) { $('tela-' + t).classList.toggle('hidden', t !== estado.tela); });
    document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.tela === estado.tela); });
    $('fab').classList.toggle('hidden', estado.tela === 'resumo' || estado.tela === 'fatura');
    if (estado.tela === 'gastos') renderGastos();
    if (estado.tela === 'resumo') renderResumo();
    if (estado.tela === 'fatura') renderFatura();
    if (estado.tela === 'regras') renderRegras();
  }
  async function mudarPeriodo(d) {
    estado.idx = Math.max(0, Math.min(estado.periodos.length - 1, estado.idx + d));
    estado.filtroPend = false;
    carregando(true);
    try { await carregarGastos(); } catch (e) { toast(erroMsg(e)); } finally { carregando(false); }
  }

  function totais() {
    var t = { cred: 0, deb: 0, pend: 0 };
    estado.gastos.forEach(function (g) {
      var pt = partes(g); t.cred += pt.cred; t.deb += pt.deb;
      if (pendente(g)) t.pend++;
    });
    t.total = t.cred + t.deb; return t;
  }

  function renderGastos() {
    var t = totais();
    if (estado.filtroPend && !t.pend) estado.filtroPend = false;
    var html = '<div class="hero"><div class="label">Total do mês</div><div class="total">' + brl.format(t.total) + '</div>' +
      '<div class="split"><span class="chip">Crédito ' + brl.format(t.cred) + '</span><span class="chip">Débito ' + brl.format(t.deb) + '</span>' +
      (t.pend ? '<button class="chip warn' + (estado.filtroPend ? ' on' : '') + '" id="f-pend">' + t.pend + ' sem categoria</button>' : '') +
      '</div></div>';
    var ls = estado.gastos.slice();
    if (estado.filtroPend) ls = ls.filter(pendente);
    if (!ls.length) {
      $('tela-gastos').innerHTML = html + '<div class="empty">Nenhum gasto neste mês ainda.<br>Eles aparecem aqui assim que chegar um SMS, ou toque em + para lançar.</div>';
      return;
    }
    ls.sort(function (a, b) { return a.data === b.data ? b.id - a.id : (a.data < b.data ? 1 : -1); });
    var grupos = [];
    ls.forEach(function (g) {
      var u = grupos[grupos.length - 1];
      if (!u || u.data !== g.data) { u = { data: g.data, itens: [], soma: 0 }; grupos.push(u); }
      u.itens.push(g); u.soma += +g.valor;
    });
    grupos.forEach(function (u) {
      html += '<div class="day"><div class="day-head"><span>' + esc(dataLonga(u.data)) + '</span><span>' + brl.format(u.soma) + '</span></div><div class="list">';
      u.itens.forEach(function (g) {
        var p = pendente(g);
        html += '<button class="item' + (p ? ' pend' : '') + '" data-id="' + g.id + '">' +
          '<span class="dot">' + esc((g.motivo || '?').charAt(0).toUpperCase()) + '</span>' +
          '<span class="info"><div class="nome">' + esc(g.motivo) + '</div>' +
          '<div class="sub">' + (p ? 'Toque para escolher a categoria' : esc(g.categoria)) + '</div></span>' +
          '<span class="val">' + brl.format(+g.valor) + (g.coluna === 'Débito' ? '<br><span class="tag">Débito</span>' : dividido(g) ? '<br><span class="tag">Débito ' + brl.format(+g.debito) + '</span>' : '') + '</span></button>';
      });
      html += '</div></div>';
    });
    $('tela-gastos').innerHTML = html;
    var fp = $('f-pend'); if (fp) fp.onclick = function () { estado.filtroPend = !estado.filtroPend; renderGastos(); };
    document.querySelectorAll('#tela-gastos .item').forEach(function (b) {
      b.onclick = function () { abrirGasto(estado.gastos.find(function (g) { return g.id === +b.dataset.id; })); };
    });
  }

  function renderResumo() {
    var t = totais(), html = '<div class="card"><h2>Totais do mês</h2>' +
      '<div class="kv"><span>Crédito</span><b>' + brl.format(t.cred) + '</b></div>' +
      '<div class="kv"><span>Débito</span><b>' + brl.format(t.deb) + '</b></div>' +
      '<div class="kv"><span>Total</span><b>' + brl.format(t.total) + '</b></div></div>';
    var porCat = {};
    estado.gastos.forEach(function (g) { var c = pendente(g) ? '?' : g.categoria; porCat[c] = (porCat[c] || 0) + +g.valor; });
    var cats = Object.keys(porCat).sort(function (a, b) { return porCat[b] - porCat[a]; });
    if (cats.length) {
      var max = porCat[cats[0]] || 1;
      html += '<div class="card"><h2>Por categoria</h2>' + cats.map(function (c) {
        var pct = t.total ? Math.round(porCat[c] / t.total * 100) : 0;
        return '<div class="bar-row"><div class="top"><span>' + esc(c === '?' ? 'Sem categoria' : c) + '</span><b>' + brl.format(porCat[c]) + '</b></div>' +
          '<div class="bar"><span style="width:' + (porCat[c] / max * 100).toFixed(1) + '%"></span></div><div class="pct">' + pct + '% do mês</div></div>';
      }).join('') + '</div>';
    }
    $('tela-resumo').innerHTML = html;
  }

  var PENSAO_PADRAO = 625;
  function renderFatura() {
    var t = totais(), p = periodoAtual();
    var pensao = p.pensao != null ? +p.pensao : PENSAO_PADRAO;
    var fatura = p.fatura != null ? +p.fatura : null;
    function emCampo(v) { return v == null ? '' : v.toFixed(2).replace('.', ','); }
    var html = '<div class="hero"><div class="label">PIX</div><div class="total" id="x-pix">&nbsp;</div>' +
      '<div class="split"><span class="chip">Fatura − Pensão − Débito</span></div></div>' +
      '<div class="card"><h2>Totais do mês</h2>' +
      '<div class="kv"><span>Crédito - Ronaldo</span><b>' + brl.format(t.cred) + '</b></div>' +
      '<div class="kv"><span>Débito - Marcelo</span><b>' + brl.format(t.deb) + '</b></div></div>' +
      '<div class="card"><h2>Valores do mês</h2>' +
      '<div class="field"><label>Fatura (R$)</label><input id="x-fatura" type="text" inputmode="decimal" placeholder="Valor da fatura do cartão" value="' + emCampo(fatura) + '"></div>' +
      '<div class="field"><label>Pensão (R$)</label><input id="x-pensao" type="text" inputmode="decimal" value="' + emCampo(pensao) + '"></div>' +
      '<div class="row-btns"><button class="btn" id="x-salvar">Salvar</button></div></div>';
    $('tela-fatura').innerHTML = html;
    function calcular() {
      var f = lerValor($('x-fatura').value), pe = lerValor($('x-pensao').value) || 0;
      $('x-pix').textContent = $('x-fatura').value.trim() && !isNaN(f) ? brl.format(f - pe - t.deb) : 'Preencha a fatura';
    }
    $('x-fatura').oninput = calcular; $('x-pensao').oninput = calcular; calcular();
    $('x-salvar').onclick = async function () {
      if (p.id == null) return toast('Crie um mês primeiro (menu ⋯ > Começar novo mês).');
      var f = $('x-fatura').value.trim() ? lerValor($('x-fatura').value) : null;
      var pe = $('x-pensao').value.trim() ? lerValor($('x-pensao').value) : PENSAO_PADRAO;
      if ((f != null && isNaN(f)) || isNaN(pe)) return toast('Valor inválido.');
      var btn = this; btn.disabled = true; carregando(true);
      try {
        await q(sb.from('periodos').update({ fatura: f, pensao: pe }).eq('id', p.id));
        p.fatura = f; p.pensao = pe; toast('Salvo.');
      } catch (e) {
        toast(/fatura|pensao/.test(erroMsg(e)) ? 'Falta preparar o banco para a fatura (rodar o SQL no Supabase).' : erroMsg(e));
      } finally { btn.disabled = false; carregando(false); }
    };
  }

  function renderRegras() {
    var html = '<p class="hint">Quando o nome no SMS contém o texto da regra, o gasto entra com o motivo, a categoria e a coluna dela. Vale a primeira regra da lista que combinar; regras novas entram no topo.</p>';
    if (!estado.regras.length) html += '<div class="empty">Nenhuma regra ainda.</div>';
    else html += '<div class="list" style="margin-top:12px">' + estado.regras.map(function (r) {
      return '<button class="item" data-id="' + r.id + '"><span class="info"><div class="nome">' + esc(r.contem) + '</div>' +
        '<div class="sub">' + esc(r.motivo) + ' · ' + esc(r.categoria) + '</div></span>' +
        (r.coluna === 'Débito' ? '<span class="tag">Débito</span>' : '') + '</button>';
    }).join('') + '</div>';
    $('tela-regras').innerHTML = html;
    document.querySelectorAll('#tela-regras .item').forEach(function (b) {
      b.onclick = function () { abrirRegra(estado.regras.find(function (r) { return r.id === +b.dataset.id; })); };
    });
  }

  /* ---------- formulários ---------- */
  function abrirSheet(html) { $('sheet').innerHTML = html; $('sheet-bg').classList.remove('hidden'); }
  function fecharSheet() { $('sheet-bg').classList.add('hidden'); $('sheet').innerHTML = ''; }
  $('sheet-bg').onclick = function (e) { if (e.target === $('sheet-bg')) fecharSheet(); };
  function seg(id, valor, opcoes) {
    return '<div class="seg" id="' + id + '">' + (opcoes || ['Crédito', 'Débito']).map(function (o) {
      return '<button type="button" data-v="' + o + '" class="' + (o === valor ? 'on' : '') + '">' + o + '</button>';
    }).join('') + '</div>';
  }
  function ligarSeg(id, aoMudar) {
    document.querySelectorAll('#' + id + ' button').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('#' + id + ' button').forEach(function (x) { x.classList.toggle('on', x === b); });
        if (aoMudar) aoMudar(b.dataset.v);
      };
    });
  }
  function valorSeg(id) { var b = document.querySelector('#' + id + ' button.on'); return b ? b.dataset.v : 'Crédito'; }
  function lerValor(s) { return Number(String(s).replace(/\s|R\$/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); }
  function menorOrdem() { return estado.regras.reduce(function (m, r) { return Math.min(m, r.ordem); }, 0); }

  function abrirGasto(g) {
    var novo = !g, p = g && pendente(g);
    var nomeSms = g ? (g.estabelecimento || g.motivo) : '';
    abrirSheet('<h3>' + (novo ? 'Novo gasto' : 'Editar gasto') + '</h3>' +
      (g && g.estabelecimento ? '<p class="hint" style="margin:-6px 0 12px">No SMS: ' + esc(g.estabelecimento) + '</p>' : '') +
      '<div class="field"><label>Valor (R$)</label><input id="f-valor" type="text" inputmode="decimal" placeholder="0,00" value="' + (g ? (+g.valor).toFixed(2).replace('.', ',') : '') + '"></div>' +
      '<div class="field"><label>Data</label><input id="f-data" type="date" value="' + (g ? g.data : hoje()) + '"></div>' +
      '<div class="field"><label>Motivo</label><input id="f-motivo" list="dl-motivos" value="' + esc(g && !p ? g.motivo : '') + '" placeholder="' + esc(p ? g.motivo : 'Ex.: Mercado') + '"></div>' +
      '<div class="field"><label>Categoria</label><input id="f-cat" list="dl-cats" value="' + esc(g && !p ? g.categoria : '') + '" placeholder="Ex.: Refeições"></div>' +
      '<div class="field"><label>Coluna</label>' + seg('f-col', g ? (dividido(g) ? 'Dividir' : g.coluna) : 'Crédito', ['Crédito', 'Débito', 'Dividir']) + '</div>' +
      '<div class="field' + (g && dividido(g) ? '' : ' hidden') + '" id="f-div"><label>Parte no Débito (R$)</label>' +
      '<input id="f-deb" type="text" inputmode="decimal" placeholder="0,00" value="' + (g && dividido(g) ? (+g.debito).toFixed(2).replace('.', ',') : '') + '">' +
      '<p class="hint" id="f-div-info" style="margin:6px 0 0"></p></div>' +
      (p ? '<label class="check"><input type="checkbox" id="f-regra" checked><span>Usar isso sempre que o SMS vier de <b>' + esc(nomeSms) + '</b> (cria uma regra e corrige os outros iguais)</span></label>' : '') +
      '<div class="row-btns"><button class="btn sec" id="f-cancelar">Cancelar</button><button class="btn" id="f-salvar">Salvar</button></div>' +
      (novo ? '' : '<div class="row-btns"><button class="btn danger" id="f-excluir">Excluir gasto</button></div>') +
      datalist('dl-motivos', motivos()) + datalist('dl-cats', categorias()));
    function infoDiv() {
      var v = lerValor($('f-valor').value), d = lerValor($('f-deb').value);
      $('f-div-info').textContent = v > 0 && d > 0 && d < v ? 'Crédito ' + brl.format(v - d) + ' · Débito ' + brl.format(d) : 'A parte no Débito precisa ser menor que o valor.';
    }
    ligarSeg('f-col', function (v) {
      $('f-div').classList.toggle('hidden', v !== 'Dividir');
      if (v === 'Dividir') { infoDiv(); $('f-deb').focus(); }
    });
    $('f-valor').addEventListener('input', infoDiv); $('f-deb').oninput = infoDiv; infoDiv();
    if (novo) setTimeout(function () { $('f-valor').focus(); }, 50);
    $('f-cancelar').onclick = fecharSheet;
    $('f-salvar').onclick = async function () {
      var valor = lerValor($('f-valor').value);
      if (!(valor > 0)) return toast('Informe um valor.');
      if (!$('f-data').value) return toast('Informe a data.');
      var motivo = $('f-motivo').value.trim() || (p ? g.motivo : '');
      if (!motivo) return toast('Informe o motivo.');
      var cat = $('f-cat').value.trim() || '?';
      var col = valorSeg('f-col');
      var dados = { data: $('f-data').value, valor: valor, motivo: motivo, categoria: cat, coluna: col === 'Dividir' ? 'Crédito' : col };
      if (col === 'Dividir') {
        var deb = lerValor($('f-deb').value);
        if (!(deb > 0 && deb < valor)) return toast('A parte no Débito precisa ser maior que zero e menor que o valor.');
        dados.debito = Math.round(deb * 100) / 100;
      } else if (g && g.debito != null) dados.debito = null;
      var btn = this; btn.disabled = true; carregando(true);
      try {
        if (novo) await q(sb.from('gastos').insert(dados));
        else await q(sb.from('gastos').update(dados).eq('id', g.id));
        if (p && $('f-regra') && $('f-regra').checked && cat !== '?') {
          await q(sb.from('regras').insert({ contem: nomeSms.toUpperCase(), motivo: motivo, categoria: cat, coluna: dados.coluna, ordem: menorOrdem() - 10 }));
          await q(sb.rpc('aplicar_regras_pendentes'));
        }
        fecharSheet(); await atualizar('Salvo.');
      } catch (e) {
        btn.disabled = false;
        toast(/debito/.test(erroMsg(e)) ? 'Falta preparar o banco para dividir (rodar o SQL no Supabase).' : erroMsg(e));
      } finally { carregando(false); }
    };
    if (!novo) $('f-excluir').onclick = async function () {
      if (!confirm('Excluir ' + g.motivo + ' de ' + brl.format(+g.valor) + '?')) return;
      try { await q(sb.from('gastos').delete().eq('id', g.id)); fecharSheet(); await atualizar('Gasto excluído.'); }
      catch (e) { toast(erroMsg(e)); }
    };
  }

  function abrirRegra(r) {
    var novo = !r;
    abrirSheet('<h3>' + (novo ? 'Nova regra' : 'Editar regra') + '</h3>' +
      '<div class="field"><label>Quando o SMS contém</label><input id="r-contem" value="' + esc(r ? r.contem : '') + '" placeholder="Ex.: VILA POUCA" autocapitalize="characters"></div>' +
      '<div class="field"><label>Motivo</label><input id="r-motivo" list="dl-motivos" value="' + esc(r ? r.motivo : '') + '" placeholder="Ex.: Restaurante"></div>' +
      '<div class="field"><label>Categoria</label><input id="r-cat" list="dl-cats" value="' + esc(r ? r.categoria : '') + '" placeholder="Ex.: Refeições"></div>' +
      '<div class="field"><label>Coluna</label>' + seg('r-col', r ? r.coluna : 'Crédito') + '</div>' +
      '<div class="row-btns"><button class="btn sec" id="r-cancelar">Cancelar</button><button class="btn" id="r-salvar">Salvar</button></div>' +
      (novo ? '' : '<div class="row-btns"><button class="btn danger" id="r-excluir">Excluir regra</button></div>') +

      if (!d.contem || !d.motivo || !d.categoria) return toast('Preencha os três campos.');

      } catch (e) { btn.disabled = false; toast(erroMsg(e)); } finally { carregando(false); }
    };
    if (!novo) $('r-excluir').onclick = async function () {
      if (!confirm('Excluir a regra ' + r.contem + '?')) return;
      try { await q(sb.from('regras').delete().eq('id', r.id)); fecharSheet(); await atualizar('Regra excluída.'); }
      catch (e) { toast(erroMsg(e)); }
    };
  }

  function abrirNovoPeriodo() {
    var sug = 'GASTOS - ' + MESES[new Date().getMonth()];
    var ultimo = estado.periodos[estado.periodos.length - 1];
    abrirSheet('<h3>Começar novo mês</h3>' +
      '<p class="hint" style="margin:0 0 14px">A partir da data abaixo, os gastos passam a contar no mês novo. Em até 10 minutos a planilha do mês novo é criada sozinha, igual à atual e sem lançamentos.</p>' +
      '<div class="field"><label>Nome</label><input id="n-nome" value="' + esc(sug) + '"></div>' +

  /* ---------- navegação ---------- */
  function fecharMenu() { $('menu').classList.add('hidden'); }

    b.onclick = function () { estado.tela = b.dataset.tela; window.scrollTo(0, 0); render(); };

  document.addEventListener('click', function (e) { if (!$('menu').contains(e.target)) fecharMenu(); });
  $('m-novo-periodo').onclick = function () { fecharMenu(); abrirNovoPeriodo(); };
  function abrirLink(url) { if (!window.open(url, '_blank')) location.href = url; } // se o iPhone bloquear a janela, abre aqui mesmo
  // Abre a planilha do mês que está na tela. Na primeira vez em cada mês, pede o link e guarda no período.
  $('m-planilha').onclick = function () {
    fecharMenu();
    var p = periodoAtual();
    if (p && p.planilha) { abrirLink(p.planilha); return; }
    if (!p || p.id == null) return toast('Crie um mês primeiro.');
    abrirSheet('<h3>Planilha de ' + esc(p.nome) + '</h3>' +
      '<p class="hint" style="margin:0 0 14px">Só na primeira vez: abra a planilha deste mês no Google Planilhas, copie o link e cole aqui. Depois, o botão abre direto.</p>' +
      '<div class="field"><label>Link da planilha</label><input id="pl-url" type="url" placeholder="https://docs.google.com/spreadsheets/d/..."></div>' +
      '<div class="row-btns"><button class="btn sec" id="pl-principal">Abrir a principal</button><button class="btn" id="pl-salvar">Salvar e abrir</button></div>');
    $('pl-principal').onclick = async function () {
      try {
        var url = await q(sb.rpc('planilha_url'));
        if (url) { fecharSheet(); abrirLink(url); } else toast('A planilha ainda não foi ligada ao app.');
      } catch (e) { toast(erroMsg(e)); }
    };
    $('pl-salvar').onclick = async function () {
      var url = $('pl-url').value.trim();
      if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(url)) return toast('Cole o link de uma planilha do Google.');
      var btn = this; btn.disabled = true;
      try {
        await q(sb.from('periodos').update({ planilha: url }).eq('id', p.id));
        p.planilha = url; fecharSheet(); abrirLink(url);
      } catch (e) { btn.disabled = false; toast(erroMsg(e)); }
    };
  };
  // Ao voltar para o app (por exemplo, depois de uma compra), atualiza sozinho.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !$('app').classList.contains('hidden')) atualizar();
  });

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) { mostrarApp(); atualizar(); } else mostrarLock();
  });
})();
</script>
</body>
</html>
